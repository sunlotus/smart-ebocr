[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ebocr"
version = "3.2.6"
description = "从国家电网 APP 截图中自动提取用电数据，对比阶梯电价与峰谷电价"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "smart-ebocr Contributors"},
]
keywords = ["ocr", "electricity", "billing", "sgcc", "smart-meter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Utilities",
    "Natural Language :: Chinese (Simplified)",
]

dependencies = [
    "flask>=3.1,<4.0",
    "flask-cors>=6.0,<7.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4,<2.0",
]
tesseract = [
    "pytesseract>=0.3,<1.0",
]
pdf = [
    "reportlab>=4.0,<5.0",
]
all = [
    "smart-ebocr[ocr,tesseract,pdf]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
